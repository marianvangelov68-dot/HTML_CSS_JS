<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="main.js"></script>

</head>
<body>
    <div class="Block1">
        <h1 class="Heading">Tip Calculator</h1>
        <p class="Text1">Enter your bill amount and a tip percentage to calculate the tip.</p>

        <p class="Bill_amount">Bill amount:</p>
        <input type="number" id="bill-amount">
        <p class="Tip_percentage">Tip percentage:</p>
        <input type="number" id="tip-percentage">
        <button id="button_calculate" class="button_calculate">CALCULATE</button>
        <br>

        <div id="Total">
            <p>Total:</p> 
            <p id="total-amount"></p>
        </div>


    </div>
    
</body>
</html>
