<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="main.js"></script>
    
</head>
<body>
<div class="Block1">
    <h1>Rock Paper Scissors</h1>
    <h3>Choose your move:</h3>
    <div class="buttons">
        <button id="rock" class="move-button"><span class="icon">✊</span><span class="label">Rock</span></button>
        <button id="paper" class="move-button"><span class="icon">✋</span><span class="label">Paper</span></button>
        <button id="scissors" class="move-button"><span class="icon">✌️</span><span class="label">Scissors</span></button>
    </div>

    <div id="result" class="result" aria-live="polite">Make your move!</div>
    <div id="scoreboard" class="scoreboard">You: <span id="user-score">0</span> — Computer: <span id="computer-score">0</span></div>
    <button id="reset" class="reset-button">Reset</button>

</div>



    
</body>
</html>
